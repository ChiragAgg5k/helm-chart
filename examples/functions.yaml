# Functions and Sites for production on top of minimal.yaml: your own S3
# store instead of the built-in object storage, and the executor on nodes of
# its own. Functions and Sites are on by default; this file hardens them. The
# S3 keys are in this file and every other secret is generated by the chart. When your S3 keys are in a
# Secret you manage (production.yaml, external-services.yaml, aws.yaml), use
# functions-existing-secrets.yaml instead.
#
#   helm upgrade --install appwrite oci://ghcr.io/appwrite/charts/appwrite \
#     --namespace appwrite --create-namespace \
#     -f minimal.yaml -f functions.yaml --wait --timeout 15m
#
# Before installing:
#
# - An S3 bucket and keys for it. Appwrite doesn't create the bucket.
# - Nodes for the executor, labelled and tainted to match the nodeSelector
#   and tolerations below:
#     kubectl label node <node> workload=executor
#     kubectl taint node <node> workload=executor:NoSchedule
# - A ClusterIssuer that solves DNS-01 (here letsencrypt-dns01), and DNS
#   records for *.functions.<domain> and *.sites.<domain> pointing at the
#   ingress controller, for preview URLs.
#
# Builds run as unprivileged Jobs in the namespace appwrite-builds. Executions
# run on the executor, which starts runtime containers through its own
# Docker-in-Docker daemon in the namespace appwrite-executor: a privileged
# pod, which is why it gets nodes of its own. The chart creates both
# namespaces. See docs/executor.md.

# Builds and the executor exchange code through S3. The chart copies these
# keys into the executor's namespace.
storage:
  device: s3
  s3:
    mode: external
    external:
      endpoint: https://s3.example.com  # empty for AWS S3
      region: us-east-1
    bucket: appwrite
    accessKeyId:
      value: <access key>
    secretAccessKey:
      value: <secret key>

compute:
  enabled: true
  executor:
    privileged: true                    # the default: Docker-in-Docker, root on the node
    nodeSelector:
      workload: executor
    tolerations:
      - key: workload
        value: executor
        effect: NoSchedule
  functionsRuntimes: [node-22, python-3.12, php-8.3]
  sitesRuntimes: [static-1, node-22]    # sites build with node-22, keep it

# Preview URLs (*.functions.<domain>, *.sites.<domain>) need a wildcard
# certificate, which only a DNS-01 issuer can get.
ingress:
  wildcard:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-dns01
    tls:
      enabled: true

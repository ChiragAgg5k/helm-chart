# Functions and Sites when S3 is already set up with its keys in a Secret you
# manage: on top of production.yaml, or of minimal.yaml with
# external-services.yaml, aws.yaml or gcp.yaml. S3 comes from those files. On
# minimal.yaml alone, use functions.yaml instead.
#
#   helm upgrade --install appwrite oci://ghcr.io/appwrite/charts/appwrite \
#     --namespace appwrite \
#     -f production.yaml -f functions-existing-secrets.yaml --wait --timeout 15m
#
# The executor runs in a namespace of its own and can't read Secrets in the
# appwrite namespace, so it needs its own copy of the executor secret and the
# S3 keys. Create its namespace and both Secrets before installing, with the
# same executor secret in each:
#
#   kubectl create namespace appwrite-executor
#   kubectl label namespace appwrite-executor \
#     pod-security.kubernetes.io/enforce=privileged
#
#   EXECUTOR_SECRET=$(openssl rand -hex 32)
#   kubectl -n appwrite create secret generic appwrite-compute \
#     --from-literal=executor-secret="$EXECUTOR_SECRET" \
#     --from-literal=orchestrator-secret="$(openssl rand -hex 32)"
#   kubectl -n appwrite-executor create secret generic appwrite-executor-credentials \
#     --from-literal=executor-secret="$EXECUTOR_SECRET" \
#     --from-literal=s3-access-key='...' \
#     --from-literal=s3-secret-key='...'
#
# Also before installing:
#
# - Nodes for the executor, labelled and tainted to match the nodeSelector
#   and tolerations below:
#     kubectl label node <node> workload=executor
#     kubectl taint node <node> workload=executor:NoSchedule
# - A ClusterIssuer that solves DNS-01 (here letsencrypt-dns01), and DNS
#   records for *.functions.<domain> and *.sites.<domain> pointing at the
#   ingress controller, for preview URLs.
#
# Builds run as unprivileged Jobs in the namespace appwrite-builds, which the
# chart creates. Executions run on the executor's own Docker-in-Docker daemon:
# a privileged pod, which is why it gets nodes of its own. See
# docs/executor.md and docs/executor.md#existing-secrets.

compute:
  enabled: true
  secrets:
    existingSecret: appwrite-compute    # executor-secret, orchestrator-secret
  executor:
    privileged: true                    # acknowledges Docker-in-Docker: root on the node
    namespace: appwrite-executor
    createNamespace: false              # created above, with its Secret
    existingSecret: appwrite-executor-credentials   # executor-secret, s3-access-key, s3-secret-key
    nodeSelector:
      workload: executor
    tolerations:
      - key: workload
        value: executor
        effect: NoSchedule
  functionsRuntimes: [node-22, python-3.12, php-8.3]
  sitesRuntimes: [static-1, node-22]    # sites build with node-22, keep it

# Preview URLs (*.functions.<domain>, *.sites.<domain>) need a wildcard
# certificate, which only a DNS-01 issuer can get.
ingress:
  wildcard:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-dns01
    tls:
      enabled: true

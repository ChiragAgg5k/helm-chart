# Every optional component but embedding, with Functions and Sites on the
# built-in object storage: the nightly workflow installs it and builds and
# executes a function. Also linted and rendered on its own like the other
# scenarios.
#
# CPU requests are cut down so everything fits on a single kind node, next to
# the control plane and Traefik.
appwrite:
  domain: appwrite.ci.local
  certificatesEmail: ci@example.com
  # Exercises force-HTTPS on internal traffic: probes, the smoke tests and
  # build callbacks use the internal API host, which Appwrite exempts.
  forceHttps: true
vectorsDb:
  enabled: true
api:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
realtime:
  resources:
    requests:
      cpu: 50m
console:
  resources:
    requests:
      cpu: 20m
workers:
  combined:
    resources:
      requests:
        cpu: 100m
tasks:
  scheduler:
    mode: separate
    resources:
      requests:
        cpu: 20m
  maintenance:
    resources:
      requests:
        cpu: 10m
  interval:
    resources:
      requests:
        cpu: 10m
browser:
  enabled: true
  resources:
    requests:
      cpu: 50m
autogravity:
  enabled: true
  resources:
    requests:
      cpu: 20m
# embedding stays off: it downloads a ~550 MB model from Hugging Face at
# start-up and wants ~3 GiB of memory, which a CI runner can't count on.
# Its templates are covered by the unit tests.
mqtt:
  enabled: true
  resources:
    requests:
      cpu: 20m
database:
  builtin:
    resources:
      requests:
        cpu: 50m
clickhouse:
  builtin:
    resources:
      requests:
        cpu: 50m
redis:
  builtin:
    resources:
      requests:
        cpu: 20m
compute:
  builds:
    # Builds get an 8-CPU limit; the default overcommit requests 1 CPU,
    # which doesn't fit on the runner next to everything else.
    cpuOvercommit: 40
  functionsRuntimes: [node-22]
  sitesRuntimes: [static-1, node-22]
  executor:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 3Gi
migrations:
  mode: job
networkPolicy:
  enabled: true

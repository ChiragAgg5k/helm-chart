# Locked-down install: NetworkPolicies on, egress restricted to DNS and the
# release itself. The datastores' metrics exporters run too, behind the
# datastores' NetworkPolicy.
appwrite:
  domain: appwrite.ci.local
  certificatesEmail: ci@example.com
  forceHttps: false
api:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
database:
  builtin:
    metrics:
      enabled: true
redis:
  builtin:
    metrics:
      enabled: true
clickhouse:
  builtin:
    metrics:
      enabled: true
networkPolicy:
  enabled: true
  egress:
    enabled: true
    # Appwrite checks avatar, screenshot and migration URLs through its own
    # resolver (_APP_DNS_EXTERNAL, by default 8.8.8.8), as docs/networking.md
    # tells users to allow.
    extraRules:
      - to: [{ipBlock: {cidr: 8.8.8.8/32}}]
        ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
  metrics:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring

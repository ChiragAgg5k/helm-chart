suite: optional components
templates:
  - templates/browser/deployment.yaml
  - templates/exiftool/deployment.yaml
  - templates/exiftool/service.yaml
  - templates/autogravity/deployment.yaml
  - templates/embedding/deployment.yaml
  - templates/embedding/pvc.yaml
  - templates/mqtt/deployment.yaml
  - templates/mqtt/service.yaml
  - templates/configmap-env.yaml
  - templates/api/deployment.yaml
release:
  name: aw
values:
  - values/required.yaml
tests:
  - it: deploys the browser by default, as Sites need it for previews
    template: templates/browser/deployment.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: deploys ExifTool by default and points Appwrite at it
    templates:
      - templates/exiftool/deployment.yaml
      - templates/exiftool/service.yaml
      - templates/configmap-env.yaml
    asserts:
      - hasDocuments:
          count: 1
        template: templates/exiftool/deployment.yaml
      - equal:
          path: spec.ports[0].port
          value: 8080
        template: templates/exiftool/service.yaml
      - equal:
          path: data._APP_EXIFTOOL_HOST
          value: http://aw-appwrite-exiftool:8080
        template: templates/configmap-env.yaml

  - it: leaves images as uploaded without ExifTool
    set:
      exiftool.enabled: false
    templates:
      - templates/exiftool/deployment.yaml
      - templates/exiftool/service.yaml
      - templates/configmap-env.yaml
    asserts:
      - hasDocuments:
          count: 0
        template: templates/exiftool/deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/exiftool/service.yaml
      - equal:
          path: data._APP_EXIFTOOL_HOST
          value: ""
        template: templates/configmap-env.yaml

  - it: runs ExifTool unprivileged with a writable /tmp and a fixed process pool
    template: templates/exiftool/deployment.yaml
    set:
      exiftool.concurrency: 4
      exiftool.replicaCount: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MAX_CONCURRENT_STRIPS, value: "4"}
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: tmp, mountPath: /tmp}
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /livez

  - it: deploys none of the others by default
    templates:
      - templates/autogravity/deployment.yaml
      - templates/embedding/deployment.yaml
      - templates/mqtt/deployment.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: disables embedding features without the embedding service
    template: templates/configmap-env.yaml
    asserts:
      - equal:
          path: data._APP_EMBEDDING
          value: disabled
      - equal:
          path: data._APP_AUTOGRAVITY_HOST
          value: ""

  - it: wires the optional services into Appwrite
    template: templates/configmap-env.yaml
    set:
      browser.enabled: true
      autogravity.enabled: true
      embedding.enabled: true
    asserts:
      - isSubset:
          path: data
          content:
            _APP_BROWSER_HOST: http://aw-appwrite-browser:3000/v1
            _APP_AUTOGRAVITY_HOST: http://aw-appwrite-autogravity:8080
            _APP_EMBEDDING: enabled
            _APP_EMBEDDING_ENDPOINT: http://aw-appwrite-embedding:3000/embed

  - it: gives Chromium a writable /tmp and shared memory
    template: templates/browser/deployment.yaml
    set:
      browser.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: shm
            emptyDir: {medium: Memory, sizeLimit: 256Mi}
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 999

  - it: lets the browser load sites through the API Service
    template: templates/browser/deployment.yaml
    set:
      browser.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALLOWED_HOSTS
            value: aw-appwrite-api.NAMESPACE.svc

  - it: fails on the removed assistant with what to do instead
    template: templates/configmap-env.yaml
    set:
      assistant.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "assistant is no longer supported: Appwrite removed the assistant in 2.4.0"

  - it: keeps embedding models on a volume and recreates the pod on updates
    template: templates/embedding/deployment.yaml
    set:
      embedding.enabled: true
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - contains:
          path: spec.template.spec.volumes
          content:
            name: models
            persistentVolumeClaim: {claimName: aw-appwrite-embedding}

  - it: runs the MQTT broker with the Appwrite image
    template: templates/mqtt/deployment.yaml
    set:
      mqtt.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: [php, app/mqtt.php]
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: mqtt

  - it: exposes MQTT through a LoadBalancer when asked
    template: templates/mqtt/service.yaml
    set:
      mqtt.enabled: true
      mqtt.service.type: LoadBalancer
      mqtt.service.loadBalancerSourceRanges: [203.0.113.0/24]
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.ports[0].port
          value: 1883
      - equal:
          path: spec.loadBalancerSourceRanges
          value: [203.0.113.0/24]

  - it: rejects Redis ACL users with MQTT
    template: templates/configmap-env.yaml
    set:
      mqtt.enabled: true
      redis.mode: external
      redis.external.host: redis.example.com
      redis.username: appwrite
    asserts:
      - failedTemplate:
          errorPattern: ignores Redis ACL users

  - it: gives every Appwrite container a writable home for Swoole
    template: templates/api/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: home, mountPath: /home/www-data}

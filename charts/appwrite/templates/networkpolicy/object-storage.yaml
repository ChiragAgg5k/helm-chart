{{- if and .Values.networkPolicy.enabled (include "appwrite.s3.builtin" .) }}
{{- /*
The built-in object store: Appwrite pods and the orchestrator of this release,
build pods and the executor may connect to its S3 port.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "appwrite.networkPolicy.metadata" (dict "root" . "name" "object-storage") }}
spec:
  podSelector:
    {{- include "appwrite.networkPolicy.selector" (dict "root" . "components" (list "seaweedfs")) | nindent 4 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "appwrite.selectorLabels" . | nindent 14 }}
              appwrite/datastore-client: "true"
        - podSelector:
            {{- include "appwrite.networkPolicy.selector" (dict "root" . "components" (list "orchestrator")) | nindent 12 }}
        {{- if .Values.compute.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "appwrite.builds.namespace" . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "appwrite.executor.namespace" . }}
        {{- end }}
      ports:
        - port: s3
          protocol: TCP
{{- end }}

apiVersion: v2
name: appwrite
description: Appwrite, the open-source backend platform, on Kubernetes. Deploys the API, console, realtime, workers and schedulers with optional built-in PostgreSQL, Redis and ClickHouse.
type: application
version: 2.0.0
appVersion: "2.5.0"
kubeVersion: ">=1.29.0-0"
home: https://github.com/appwrite/helm-chart
icon: https://raw.githubusercontent.com/appwrite/appwrite/2.5.0/public/images/logos/appwrite-icon.svg
sources:
  - https://github.com/appwrite/helm-chart
  - https://github.com/appwrite/appwrite
keywords:
  - appwrite
  - backend
  - baas
  - database
  - authentication
  - storage
  - realtime
maintainers:
  - name: levivannoort
    url: https://github.com/levivannoort
annotations:
  artifacthub.io/license: BSD-3-Clause
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: database
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/appwrite/helm-chart
    - name: Documentation
      url: https://github.com/appwrite/helm-chart/blob/main/docs/README.md
    - name: Example values
      url: https://github.com/appwrite/helm-chart/tree/main/examples
    - name: Appwrite
      url: https://appwrite.io
    - name: support
      url: https://github.com/appwrite/helm-chart/issues
  artifacthub.io/changes: |
    - kind: changed
      description: 'Functions and Sites are on by default: `compute.enabled` and `compute.executor.privileged` default to `true`, so a plain install runs the executor as a privileged pod in a namespace of its own. Set `compute.enabled: false` on clusters that forbid privileged pods.'
    - kind: changed
      description: 'Files are stored in object storage by default: `storage.device` defaults to `s3`, served by the built-in SeaweedFS. To keep 1.0.0''s behaviour, set `storage.device: local` and `compute.enabled: false`.'
    - kind: changed
      description: Appwrite 2.5.0, with console 1.2.74, executor 1.1.2, browser 0.3.6 and geo 0.3.2, and the new trusted-proxy, internal-address and DNS settings in the environment defaults (networking.md).
      links:
        - name: networking.md
          url: https://github.com/appwrite/helm-chart/blob/main/docs/networking.md#tls-and-forcehttps
    - kind: changed
      description: 'External S3 settings move to `storage.s3.external.endpoint` and `storage.s3.external.region`, with `storage.s3.mode: external`. Setting the old keys fails with where they went.'
    - kind: changed
      description: ClickHouse drops its per-second metric, trace and text logs and gives tables left behind by a config change a TTL, as Appwrite 2.4.0 does.
    - kind: changed
      description: CI upgrades from the published chart 1.0.0 with default values.
    - kind: added
      description: 'Built-in object storage: SeaweedFS as a single-replica StatefulSet (`storage.s3.mode: builtin`), with generated keys, the bucket created on start, and a NetworkPolicy that admits only Appwrite, the orchestrator, builds and the executor (storage.md).'
      links:
        - name: storage.md
          url: https://github.com/appwrite/helm-chart/blob/main/docs/storage.md#built-in-object-storage
    - kind: added
      description: Troubleshooting for deployments that fail with an internal error while Functions and Sites are off.
    - kind: removed
      description: 'The assistant: Appwrite removed it in 2.4.0. Setting `assistant.*` fails with that message.'
    - kind: fixed
      description: 'Site screenshots: the browser gets the API Service in `ALLOWED_HOSTS`, as browser 0.3.5 and later require for private addresses.'
    - kind: fixed
      description: '`make env-defaults` works with Appwrite 2.4.0 and later, and no longer leaves an error message in `files/env-defaults.yaml` when it fails.'
  artifacthub.io/images: |
    - name: appwrite
      image: docker.io/appwrite/appwrite:2.5.0
    - name: autogravity
      image: ghcr.io/appwrite/autogravity:0.0.11
    - name: browser
      image: docker.io/appwrite/browser:0.3.6
    - name: builds
      image: ghcr.io/open-runtimes/orchestrator/job-sidecar:2.2.3
    - name: builtin
      image: docker.io/appwrite/postgres:0.1.0
    - name: builtin
      image: docker.io/library/redis:7.4.11-alpine
    - name: builtin
      image: docker.io/clickhouse/clickhouse-server:26.4.5-alpine
    - name: builtin
      image: docker.io/chrislusf/seaweedfs:4.48
    - name: builtin-exporter
      image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    - name: builtin-exporter
      image: docker.io/oliver006/redis_exporter:v1.93.0-alpine
    - name: console
      image: docker.io/appwrite/new:1.2.74-self-hosted
    - name: dind
      image: docker.io/library/docker:29.9.0-dind
    - name: embedding
      image: docker.io/appwrite/embedding:0.3.1
    - name: executor
      image: docker.io/openruntimes/executor:1.1.2
    - name: geo
      image: docker.io/appwrite/geo:0.3.2
    - name: orchestrator
      image: ghcr.io/open-runtimes/orchestrator/jobs-service:2.2.3
  artifacthub.io/displayName: Appwrite

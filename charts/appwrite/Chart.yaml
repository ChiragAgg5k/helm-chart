apiVersion: v2
name: appwrite
description: Appwrite, the open-source backend platform, on Kubernetes. Deploys the API, console, realtime, workers and schedulers with optional built-in PostgreSQL, Redis and ClickHouse.
type: application
version: 1.0.0
appVersion: "2.5.0"
kubeVersion: ">=1.29.0-0"
home: https://github.com/appwrite/helm-chart
icon: https://raw.githubusercontent.com/appwrite/appwrite/2.5.0/public/images/logos/appwrite-icon.svg
sources:
  - https://github.com/appwrite/helm-chart
  - https://github.com/appwrite/appwrite
keywords:
  - appwrite
  - backend
  - baas
  - database
  - authentication
  - storage
  - realtime
maintainers:
  - name: levivannoort
    url: https://github.com/levivannoort
annotations:
  artifacthub.io/license: BSD-3-Clause
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: database
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/appwrite/helm-chart
    - name: Documentation
      url: https://github.com/appwrite/helm-chart/blob/main/docs/README.md
    - name: Example values
      url: https://github.com/appwrite/helm-chart/tree/main/examples
    - name: Appwrite
      url: https://appwrite.io
    - name: support
      url: https://github.com/appwrite/helm-chart/issues
  artifacthub.io/changes: |
    - kind: added
      description: The API, console, realtime, workers (combined, separate or grouped), schedulers, maintenance and interval tasks, and geo, all passing the `restricted` Pod Security Standard.
    - kind: added
      description: Built-in single-replica PostgreSQL, Redis and ClickHouse, or external services (PostgreSQL, MariaDB, MySQL, MongoDB; Redis; ClickHouse over HTTP or TLS). Each backing service (`database`, `redis`, `clickhouse`, `storage`, `smtp`, `documentsDb`, `vectorsDb`) has a `mode` switch, and every credential takes the same `{value, secretName, secretKey}` shape.
    - kind: added
      description: Storage on a volume or in S3-compatible object storage.
    - kind: added
      description: 'Opt-in Functions and Sites in the cluster: builds run as Kubernetes Jobs through the open-runtimes orchestrator, in their own `baseline` namespace; executions run on the open-runtimes executor on Docker-in-Docker, a privileged pod you accept with `compute.executor.privileged` (or Sysbox through `runtimeClassName`), in its own namespace behind NetworkPolicies.'
    - kind: added
      description: Ingress and Gateway API HTTPRoutes for the API, console, realtime, function and site previews, and custom domains.
    - kind: added
      description: Optional browser, assistant, autogravity, embedding and MQTT components.
    - kind: added
      description: PodDisruptionBudgets and topology spread by default; opt-in NetworkPolicies, HorizontalPodAutoscalers, and metrics for the built-in datastores (exporters, ServiceMonitors and a PrometheusRule).
    - kind: added
      description: Credentials generated once and kept across upgrades and uninstalls, with guards against changing the encryption key or regenerating datastore passwords. Pods restart when a Secret value they read changes.
    - kind: added
      description: Data migrations on upgrade, a downgrade guard, and a guard against an `image.tag` of another Appwrite major version.
    - kind: added
      description: The same extension keys on every component, the built-in datastores included (`extraEnv`, `extraVolumes`, `extraVolumeMounts`, `extraInitContainers`, `extraContainers`), pod-wide `defaults`, and `extraObjects` for your own manifests.
    - kind: added
      description: '`values.schema.json`, `helm test` pods, documentation from getting started to backups, GitOps and troubleshooting, and example values files for local, production, external services, AWS, GCP, Azure, and Functions and Sites installs.'
  artifacthub.io/images: |
    - name: appwrite
      image: docker.io/appwrite/appwrite:2.5.0
    - name: autogravity
      image: ghcr.io/appwrite/autogravity:0.0.11
    - name: browser
      image: docker.io/appwrite/browser:0.3.6
    - name: builds
      image: ghcr.io/open-runtimes/orchestrator/job-sidecar:2.2.3
    - name: builtin
      image: docker.io/appwrite/postgres:0.1.0
    - name: builtin
      image: docker.io/library/redis:7.4.11-alpine
    - name: builtin
      image: docker.io/clickhouse/clickhouse-server:26.4.5-alpine
    - name: builtin-exporter
      image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    - name: builtin-exporter
      image: docker.io/oliver006/redis_exporter:v1.93.0-alpine
    - name: console
      image: docker.io/appwrite/new:1.2.74-self-hosted
    - name: dind
      image: docker.io/library/docker:29.9.0-dind
    - name: embedding
      image: docker.io/appwrite/embedding:0.3.1
    - name: executor
      image: docker.io/openruntimes/executor:1.1.2
    - name: geo
      image: docker.io/appwrite/geo:0.3.2
    - name: orchestrator
      image: ghcr.io/open-runtimes/orchestrator/jobs-service:2.2.3
  artifacthub.io/displayName: Appwrite
